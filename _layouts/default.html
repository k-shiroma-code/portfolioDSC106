<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kyle Shiroma - Data Scientist & Machine Learning Engineer Portfolio">
  <meta name="author" content="Kyle Shiroma">
  <title>{{ page.title }} | {{ site.title }}</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  
  <style>
    /* ========================================
       CSS Variables & Base Styles
    ======================================== */
    :root {
      --accent: #a78bfa;
      --accent-soft: #c4b5fd;
      --accent-glow: rgba(167, 139, 250, 0.15);
      --surface: #0a0a0a;
      --surface-elevated: #141414;
      --surface-border: #222;
      --surface-hover: #1a1a1a;
      --text-primary: #f5f5f5;
      --text-secondary: #a0a0a0;
      --text-muted: #666;
      --font-serif: 'Instrument Serif', Georgia, serif;
      --font-sans: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-sans);
      background: var(--surface);
      color: var(--text-primary);
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ========================================
       Container
    ======================================== */
    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ========================================
       Header
    ======================================== */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--surface-border);
    }

    .header-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 0;
    }

    .site-title {
      font-family: var(--font-sans);
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .site-title a {
      color: var(--text-primary);
      transition: color 0.2s ease;
    }

    .site-title a:hover {
      color: var(--accent);
    }

    /* ========================================
       Navigation
    ======================================== */
    .main-navigation {
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    .main-navigation a {
      color: var(--text-secondary);
      font-size: 0.95rem;
      font-weight: 500;
      padding: 0.5rem 0;
      position: relative;
      transition: color 0.2s ease;
    }

    .main-navigation a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--accent);
      transition: width 0.3s ease;
    }

    .main-navigation a:hover {
      color: var(--text-primary);
    }

    .main-navigation a:hover::after {
      width: 100%;
    }

    .main-navigation a[aria-current="page"],
    .main-navigation a.active {
      color: var(--accent);
    }

    .main-navigation a[aria-current="page"]::after,
    .main-navigation a.active::after {
      width: 100%;
    }

    /* Resume Button */
    .nav-button {
      background: var(--accent);
      color: #0a0a0a !important;
      font-weight: 600;
      padding: 0.6rem 1.25rem !important;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .nav-button::after {
      display: none !important;
    }

    .nav-button:hover {
      background: var(--accent-soft);
      transform: translateY(-1px);
    }

    /* ========================================
       Mobile Menu Toggle
    ======================================== */
    .mobile-menu-toggle {
      display: none;
      background: none;
      border: none;
      padding: 0.5rem;
      cursor: pointer;
      color: var(--text-secondary);
      transition: color 0.2s ease;
    }

    .mobile-menu-toggle:hover {
      color: var(--accent);
    }

    /* ========================================
       Main Content
    ======================================== */
    .main-content {
      flex: 1;
      padding: 3rem 0;
    }

    /* ========================================
       Footer
    ======================================== */
    .site-footer {
      background: var(--surface-elevated);
      border-top: 1px solid var(--surface-border);
      padding: 2.5rem 0;
      margin-top: auto;
    }

    .footer-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1.5rem;
    }

    .footer-copyright {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .footer-links {
      display: flex;
      gap: 1.5rem;
    }

    .footer-links a {
      color: var(--text-muted);
      transition: color 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
    }

    .footer-links a:hover {
      color: var(--accent);
    }

    .footer-links svg {
      width: 18px;
      height: 18px;
    }

    /* ========================================
       Mobile Styles
    ======================================== */
    @media (max-width: 768px) {
      .container {
        padding: 0 16px;
      }

      .site-title {
        font-size: 1.25rem;
      }

      .mobile-menu-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        z-index: 101;
      }

      .main-navigation {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(10, 10, 10, 0.98);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
        padding: 2rem;
        transform: translateY(-100%);
        opacity: 0;
        visibility: hidden;
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        z-index: 99;
      }

      .main-navigation.is-open {
        transform: translateY(0);
        opacity: 1;
        visibility: visible;
      }

      .main-navigation a {
        font-size: 1.5rem;
        padding: 1rem 0;
        color: var(--text-secondary);
        text-align: center;
      }

      .main-navigation a::after {
        bottom: 0.5rem;
      }

      .nav-button {
        margin-top: 1rem;
        padding: 1rem 2rem !important;
        font-size: 1.1rem;
      }

      body.mobile-menu-open {
        overflow: hidden;
      }

      .footer-content {
        flex-direction: column;
        text-align: center;
      }

      .main-content {
        padding: 2rem 0;
      }
    }

    @media (min-width: 769px) and (max-width: 1024px) {
      .container {
        padding: 0 32px;
      }

      .main-navigation {
        gap: 1.5rem;
      }

      .main-navigation a {
        font-size: 0.9rem;
      }
    }

    /* ========================================
       Utility Classes
    ======================================== */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>

<body>

  <!-- Mobile Menu Script -->
  <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
    document.addEventListener('DOMContentLoaded', function() {
      const mobileToggle = document.querySelector('.mobile-menu-toggle');
      const navigation = document.querySelector('.main-navigation');
      const body = document.body;

      if (mobileToggle && navigation) {
        const hamburgerIcon = `
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        `;
        
        const closeIcon = `
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        `;

        function closeMenu() {
          navigation.classList.remove('is-open');
          body.classList.remove('mobile-menu-open');
          mobileToggle.setAttribute('aria-expanded', 'false');
          mobileToggle.querySelector('svg').innerHTML = hamburgerIcon;
        }

        function openMenu() {
          navigation.classList.add('is-open');
          body.classList.add('mobile-menu-open');
          mobileToggle.setAttribute('aria-expanded', 'true');
          mobileToggle.querySelector('svg').innerHTML = closeIcon;
        }

        mobileToggle.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          const isExpanded = this.getAttribute('aria-expanded') === 'true';
          isExpanded ? closeMenu() : openMenu();
        });

        // Close menu when clicking a link
        navigation.querySelectorAll('a').forEach(link => {
          link.addEventListener('click', closeMenu);
        });

        // Close menu when clicking outside
        document.addEventListener('click', function(e) {
          if (navigation.classList.contains('is-open') && 
              !navigation.contains(e.target) && 
              !mobileToggle.contains(e.target)) {
            closeMenu();
          }
        });

        // Close menu on Escape key
        document.addEventListener('keydown', function(e) {
          if (e.key === 'Escape' && navigation.classList.contains('is-open')) {
            closeMenu();
            mobileToggle.focus();
          }
        });

        // Close menu on resize to desktop
        window.addEventListener('resize', function() {
          if (window.innerWidth > 768) {
            closeMenu();
          }
        });
      }
    });
  </script>
